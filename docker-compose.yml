services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-distribuidora_garcia}
      POSTGRES_USER: ${POSTGRES_USER:-pos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    networks:
      - internal

  app:
    build:
      context: .
      dockerfile: server/Dockerfile
    restart: unless-stopped
    container_name: pos-app
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-pos}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-distribuidora_garcia}
      PORT: 3001
      TICKET_NEGOCIO: ${TICKET_NEGOCIO:-Distribuidora García}
      TICKET_DIRECCION: ${TICKET_DIRECCION:-}
      TICKET_TELEFONO: ${TICKET_TELEFONO:-}
      TICKET_RFC: ${TICKET_RFC:-}
      TICKET_PIE: ${TICKET_PIE:-Gracias por su compra}
      TICKET_ANCHO_MM: ${TICKET_ANCHO_MM:-80}
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      - db
    networks:
      - internal
      - web

networks:
  internal:
  web:
    external: true

volumes:
  db_data:
  uploads_data:
